name: Update JioTV Json + m3u

on:
  schedule:
    # GitHub cron uses UTC. Run every hour at minute 17.
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: update-jtv-playlists
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: python -m pip install requests

      - name: Regenerate JSON and M3U
        run: python new_jtv.py

      - name: Commit changed playlists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jtv.json jtv.m3u
          if git diff --cached --quiet; then
            echo "No playlist changes to commit"
            exit 0
          fi
          git commit -m "Update JioTV playlists"
          git push
